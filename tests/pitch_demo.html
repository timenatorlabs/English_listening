<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitch chart demo</title>
  <link rel="stylesheet" href="../app/fonts/noto-sans-jp.css">
  <link rel="stylesheet" href="../app/styles.css">
</head>
<body>
  <main>
    <!-- Visual check of the per-sentence intonation view. The "learner" is another TTS voice
         reading the same passage, delayed by 0.6 s and made very quiet (x0.03) like a phone
         recording. Sample data, not a real learner. -->
    <section class="card"><div id="out">analysing…</div></section>
  </main>
  <script type="module">
    import { f0Track, semitones, bestLag, localLag, voicedShare, sentenceChart, directionAgreement, pitchNote } from "../app/pitch.js";
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const p = (await (await fetch("../app/data/shadowing.json")).json()).passages.find((x) => x.id === "2-a");
    const load = async (path) => ac.decodeAudioData(await (await fetch(path)).arrayBuffer());
    // model: per-sentence contours joined with 0.4 s pauses (as the app does)
    const parts = [];
    const segments = [];
    let o = 0;
    // decodeAudioData resamples to the context rate (often 48 kHz), not the file's 22.05 kHz
    const userParts = [new Float32Array(Math.round(0.6 * ac.sampleRate))];
    for (let i = 0; i < p.sentences.length; i++) {
      const b = await load(`../app/audio/sh/2-a-${i}_539.mp3`);
      const c = semitones(f0Track(b.getChannelData(0), b.sampleRate));
      segments.push({ start: o, end: o + c.length });
      parts.push(c, new Float32Array(40).fill(NaN));
      o += c.length + 40;
      const u = await load(`../app/audio/sh/2-a-${i}_902.mp3`);
      userParts.push(u.getChannelData(0).map((v) => v * 0.03), new Float32Array(Math.round(0.4 * u.sampleRate)));
    }
    const model = new Float32Array(o);
    let k = 0;
    for (const x of parts) { model.set(x, k); k += x.length; }
    const n = userParts.reduce((a, x) => a + x.length, 0);
    const raw = new Float32Array(n);
    k = 0;
    for (const x of userParts) { raw.set(x, k); k += x.length; }
    const user = semitones(f0Track(raw, ac.sampleRate));
    let lag = bestLag(model, user);
    document.getElementById("out").innerHTML = `<div class="legend"><span><i class="key-s1"></i>お手本</span><span><i class="key-s2"></i>自分の声</span></div>`
      + p.sentences.map((s, i) => {
        const { start, end } = segments[i];
        const l = localLag(model, user, start, end, lag, 80);
        lag = l;
        const m = model.slice(start, end);
        const u = user.slice(start + l, end + l);
        const a = directionAgreement(m, u, 0, 8);
        return `<div class="sentence-row"><p class="small"><strong>${i + 1}.</strong> ${s.text}</p>${sentenceChart(m, u)}
          <p class="muted small">voiced ${Math.round(voicedShare(u) * 100)}% / agreement ${a === null ? "-" : Math.round(a * 100) + "%"}</p></div>`;
      }).join("") + pitchNote();
    document.title = "done";
  </script>
</body>
</html>
