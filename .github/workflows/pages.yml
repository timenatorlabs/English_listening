# Publishes only the app/ folder to GitHub Pages on every push to main, and once a day
# (to refresh the extensive-listening episode lists with tools/fetch_feeds.py).
# The daily run does not commit anything; if a feed cannot be fetched, the list in the
# repository is published as it is.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh episode lists
        run: python3 tools/fetch_feeds.py || echo "feed refresh failed; publishing the stored lists"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
